name: Deploy GitHub Pages

# Publishes docs/ to https://scripts-and-tables.github.io/erp-synthetic-data-generator/
# on every push to main, plus on demand via workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deploy; do NOT cancel in-progress runs
# (so a running deploy isn't aborted by a follow-up commit).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package docs/ as Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
