name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -m "not slow" --cov=erp_synth --cov-report=xml --cov-report=term
      - name: Run slow integration tests
        run: pytest -m slow

  smoke:
    name: End-to-end smoke + verify
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate small dataset
        run: |
          erp-synth --seed 42 --market us --n-customers 50 \
                    --date-from 2023-01-01 --date-till 2024-06-30 \
                    --out-dir /tmp/synth-ci
      - name: Verify dataset integrity
        run: python scripts/verify.py /tmp/synth-ci
      - name: Check reproducibility (same seed → same hashes)
        run: |
          erp-synth --seed 42 --market us --n-customers 50 \
                    --date-from 2023-01-01 --date-till 2024-06-30 \
                    --out-dir /tmp/synth-ci-2
          for f in items.csv customers.csv stores.csv promotions.csv \
                   invoice_headers.csv sales_lines.csv \
                   marketing_spend.csv support_tickets.csv nps_surveys.csv; do
            sha_a=$(sha256sum "/tmp/synth-ci/$f" | cut -d' ' -f1)
            sha_b=$(sha256sum "/tmp/synth-ci-2/$f" | cut -d' ' -f1)
            if [ "$sha_a" != "$sha_b" ]; then
              echo "REPRODUCIBILITY FAILURE: $f differs"
              exit 1
            fi
            echo "  $f  $sha_a  ✓"
          done
