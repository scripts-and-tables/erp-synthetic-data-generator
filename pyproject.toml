[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-synthetic-data-generator"
version = "0.2.0"
description = "Realistic, multi-year, AdventureWorks-style retail data — generated from a single Python command, fully reproducible from a seed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ERP Synthetic Data Generator contributors" },
]
keywords = [
    "synthetic-data", "retail", "erp", "crm", "analytics",
    "adventureworks", "retailsynth", "cohort", "seasonality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "Faker>=20",
]

[project.optional-dependencies]
charts = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "matplotlib>=3.7",
]

[project.scripts]
erp-synth = "run:main"

[project.urls]
Homepage = "https://github.com/scripts-and-tables/erp-synthetic-data-generator"
Repository = "https://github.com/scripts-and-tables/erp-synthetic-data-generator"
Issues = "https://github.com/scripts-and-tables/erp-synthetic-data-generator/issues"

[tool.setuptools]
packages = ["erp_synth"]
py-modules = ["run"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: end-to-end tests that run the full pipeline (~10s+)",
]

[tool.coverage.run]
branch = true
source = ["erp_synth"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "output_csv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (use line-length config)
    "B008",  # function calls in default args (Faker patterns)
    "SIM108", # if-else vs ternary (sometimes ternary is uglier)
    "B905",  # zip(..., strict=) — accept default for now
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow `assert False` in tests
"scripts/*" = ["E402", "E702", "F841"]  # script preambles, chained log lines, scratch vars
"erp_synth/sales.py" = ["B023", "E741"]  # intentional closure capture; `l` is a line
"erp_synth/customers.py" = ["F841"]  # rng_py kept for symmetry with rng_np
